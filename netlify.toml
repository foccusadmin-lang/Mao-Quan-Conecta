# Alternativa ao Vercel — mesma configuração para a Netlify
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "https://www.maoquanconecta.com.br/*"
  to = "https://maoquanconecta.com.br/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
